<div class="bg-white shadow px-4 py-5 sm:rounded-lg sm:p-6 animate-fade-in">
  <div class="md:grid md:grid-cols-3 md:gap-6">
    <div class="md:col-span-1">
      <h3 class="text-lg font-medium leading-6 text-gray-900">{{ pageTitle() }}</h3>
      <p class="mt-1 text-sm text-gray-500">
        {{ isNew() ? 'Fill in the details to create a new support ticket.' : 'View and update the ticket details below.' }}
      </p>
    </div>
    <div class="mt-5 md:mt-0 md:col-span-2">
      <form [formGroup]="ticketForm" (ngSubmit)="saveTicket()">
        <div class="space-y-6">

          <!-- Title -->
          <div>
            <label for="title" class="block text-sm font-medium text-gray-700">Title</label>
            <input type="text" id="title" formControlName="title"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>

          <!-- Creator Name (read-only) -->
          <div>
            <label class="block text-sm font-medium text-gray-700">Created By</label>
            <input type="text" [value]="currentUser()?.name || ''" readonly
              class="mt-1 block w-full border border-gray-200 rounded-md bg-gray-50 py-2 px-3 text-gray-500 sm:text-sm cursor-not-allowed">
          </div>

          <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">

            <!-- Category -->
            <div class="sm:col-span-3">
              <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
              <select id="category" formControlName="category"
                class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                <option [ngValue]="null" disabled>Select a category</option>
                @for(category of categories; track category) {
                  <option [value]="category">{{ category }}</option>
                }
              </select>
            </div>

            <!-- Sub-Category -->
            <div class="sm:col-span-3">
              <label for="subCategory" class="block text-sm font-medium text-gray-700">Sub-Category</label>
              <select id="subCategory" formControlName="subCategory"
                class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm disabled:bg-gray-100">
                <option [ngValue]="null" disabled>Select a sub-category</option>
                @for(subCategory of availableSubCategories(); track subCategory) {
                  <option [value]="subCategory">{{ subCategory }}</option>
                }
              </select>
            </div>

            <!-- Division (full width) -->
            <div class="sm:col-span-6">
              <label for="division" class="block text-sm font-medium text-gray-700">Division</label>
              <select id="division" formControlName="division"
                class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                <option [ngValue]="null" disabled>Select a division</option>
                @for(division of divisions; track division) {
                  <option [value]="division">{{ division }}</option>
                }
              </select>
            </div>
          </div>

          <!-- Description (below category / subcategory / division) -->
          <div>
            <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
            <textarea id="description" formControlName="description" rows="5"
              class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"></textarea>
          </div>

          <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
            <div class="sm:col-span-3">
              <label for="status" class="block text-sm font-medium text-gray-700">Status</label>
              <select id="status" formControlName="status"
                class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                @for(status of availableStatuses(); track status) {
                  <option [value]="status">{{ status }}</option>
                }
              </select>
            </div>

            <div class="sm:col-span-3">
              <label for="priority" class="block text-sm font-medium text-gray-700">Priority</label>
              <select id="priority" formControlName="priority"
                class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                @for(priority of priorities; track priority) {
                  <option [value]="priority">{{ priority }}</option>
                }
              </select>
            </div>

            <div class="sm:col-span-3">
              <label for="assignee" class="block text-sm font-medium text-gray-700">Assignee</label>
              <select id="assignee" formControlName="assigneeId"
                class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm disabled:bg-gray-50">
                <option [ngValue]="null">Unassigned</option>
                @for(user of users(); track user.id) {
                  <option [ngValue]="user.id">{{ user.name }}</option>
                }
              </select>
            </div>
          </div>

          <!-- Screenshot -->
          <div>
            <label class="block text-sm font-medium text-gray-700">Screenshot</label>
            @if(ticketForm.value.screenshotUrl) {
              <div class="mt-1">
                <img [src]="ticketForm.value.screenshotUrl" alt="Screenshot preview" class="max-h-48 rounded-md border border-gray-200">
                <div class="flex items-center justify-between mt-2">
                  <p class="text-sm text-gray-500 truncate">{{ ticketForm.value.screenshotFileName }}</p>
                  <button type="button" (click)="removeScreenshot()" class="text-sm font-medium text-red-600 hover:text-red-500">Remove</button>
                </div>
              </div>
            } @else {
              <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md">
                <div class="space-y-1 text-center">
                  <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                  <div class="flex text-sm text-gray-600">
                    <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
                      <span>Upload a file</span>
                      <input id="file-upload" name="file-upload" type="file" class="sr-only" (change)="onFileSelected($event)" accept="image/*">
                    </label>
                    <p class="pl-1">or drag and drop</p>
                  </div>
                  <p class="text-xs text-gray-500">PNG, JPG, GIF up to 10MB</p>
                </div>
              </div>
            }
          </div>
        </div>

        <div class="flex justify-end mt-6 pt-4 border-t">
          <button type="button" (click)="cancel()"
            class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Cancel
          </button>
          <button type="submit" [disabled]="!ticketForm.valid || loading()"
            class="ml-3 inline-flex justify-center items-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-blue-400">
            @if(loading()) {
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Saving...</span>
            } @else {
              <span>Save</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
